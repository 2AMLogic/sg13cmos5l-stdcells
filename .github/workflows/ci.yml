name: CI

# Keeps the harness and evidence formats valid. The gates here are the same
# scripts `npm run check:ci` runs locally: scripts/check_json.py (+ its self-test),
# scripts/check_item6_statement.py (+ its self-test), scripts/test_setup_env.sh
# (`check:setup-env`) and scripts/check_signoff.sh (+ its self-test), plus the
# PDK-free design/RTL checks (`check:design-rtl`). Keep the two in step.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Validate JSON config/evidence files and README links
        run: |
          python3 -I scripts/check_json.py
          bash scripts/test_check_json.sh

      - name: Check the item 6 not_applicable statement against the spec
        run: |
          python3 -I scripts/check_item6_statement.py
          bash scripts/test_check_item6_statement.sh

      # scripts/setup-env.sh refuses to run at all without bison and flex (it
      # builds ngspice), so the fail-closed test cannot reach the pin check
      # without them: install them rather than let a missing tool be reported
      # as a pin disagreement. No PDK and no large download -- the test aborts
      # setup-env.sh at the pin/script comparison, after the small
      # klayout-tools fetch scripts.
      - name: Install the build tools setup-env.sh requires
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bison flex

      - name: scripts/setup-env.sh fails closed on a bad checksum or doctored pin
        run: bash scripts/test_setup_env.sh

      # The item-9 inventory's copy of the tool and PDK pins against the files
      # that own them. Needs no klt, so it runs here rather than in `signoff`;
      # `signoff` runs the same comparison again as check_signoff.sh's first step.
      - name: Check the item-9 attestation pins against the pins of record
        run: bash scripts/test_check_signoff.sh

      # TODO(harness): add the harness self-test step here when the harness
      # lands; its entrypoint is not defined yet, so none is invented.

  signoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        run: pip install uv

      # Re-runs klt signoff against the committed record and re-checks every
      # attestation envelope the block manifest cites, all at the repo's klt pin
      # (layout/toolchain.json). No version literal belongs in this workflow.
      - name: Re-run klt signoff and re-check the attestation envelopes
        run: scripts/check_signoff.sh

  design-rtl:
    # PDK-free design and RTL checks: generator freshness (netlists, RTL models,
    # characterization requests, functional testbenches), catalog, switch-level
    # and cocotb + Icarus truth tables, the characterization self-tests, and the
    # netlist-vs-RTL functional comparison against the committed report.
    # Same commands as `npm run check:design-rtl`, and the same cocotb pin as
    # `scripts/setup-env.sh` installs locally.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install simulators (distro ngspice for logic-level stubs, Icarus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ngspice iverilog

      # The full bring-up (scripts/setup-env.sh) is far too heavy for a job that
      # needs only cocotb and Icarus, so this job keeps its own light venv -- but
      # it reads the cocotb spec from the repo's one pin of record
      # (rtl/toolchain.json) rather than carrying a version literal, exactly as
      # the signoff job reads the klt pin from layout/toolchain.json. No version
      # literal belongs in this workflow.
      - name: Create venv with cocotb at the repo pin (rtl/toolchain.json)
        run: |
          cocotb_spec="$(python3 -I -c 'import json; print(json.load(open("rtl/toolchain.json"))["cocotb"]["install_spec"])')"
          test -n "$cocotb_spec"
          echo "installing $cocotb_spec"
          python3 -m venv .venv
          .venv/bin/pip install "$cocotb_spec"

      - name: Catalog is 40 distinct well-formed cells
        run: python3 design/check_catalog.py

      - name: Committed netlists match the generator
        run: python3 design/gen_netlists.py --check

      - name: Committed RTL models match the generator
        run: python3 rtl/gen_models.py --check

      - name: Committed characterization requests match the generator
        run: python3 sim/characterize/gen_requests.py --check

      - name: Switch-level truth tables, generator and characterization unit tests
        run: python3 -m unittest design/test_check_catalog.py design/tests/test_gen_netlists.py rtl/tests/test_gen_models.py sim/characterize/test_margin.py sim/characterize/test_check_lib_coverage.py

      - name: Exhaustive cocotb + Icarus truth tables of all models
        run: .venv/bin/python rtl/tests/run_tests.py

      # Covers verification/functional/gen_functional.py --check (its first
      # step) and test_arcs.py (its last), so neither needs a step of its own.
      # The netlist side is the committed records/tt.report.json: no PDK, no
      # SPICE run.
      - name: Functional testbenches fresh; netlist-vs-RTL compare and arcs
        run: bash verification/functional/test_functional.sh
